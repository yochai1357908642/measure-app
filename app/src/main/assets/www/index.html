<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מדידות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חבילת מדידות</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F2F3EF; --surface:#FFFFFF; --ink:#1C2326; --muted:#5A6568; --line:#CFD4CD;
  --tape:#F5C518; --tape-ink:#1C2326; --action:#1F6F78; --danger:#A8321E; --grid:#E4E8E1; --water:#A9DBEA;
  --font:"IBM Plex Sans Hebrew","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14181A; --surface:#1D2326; --ink:#E9EDEA; --muted:#9BA6A8; --line:#333D41;
    --action:#6CC3CC; --danger:#F08A78; --grid:#272F32; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14181A; --surface:#1D2326; --ink:#E9EDEA; --muted:#9BA6A8; --line:#333D41;
  --action:#6CC3CC; --danger:#F08A78; --grid:#272F32; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}

/* סרט המדידה */
.tape{position:relative;height:36px;overflow:hidden;background:
  repeating-linear-gradient(to left,var(--tape-ink) 0 2px,transparent 2px 80px) top right/100% 20px no-repeat,
  repeating-linear-gradient(to left,var(--tape-ink) 0 1px,transparent 1px 40px) top right/100% 14px no-repeat,
  repeating-linear-gradient(to left,var(--tape-ink) 0 1px,transparent 1px 8px) top right/100% 8px no-repeat,
  var(--tape);
  border-bottom:2px solid var(--tape-ink)}
.tape span{position:absolute;bottom:1px;color:var(--tape-ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}

main{max-width:720px;margin:0 auto;padding:20px 18px 96px}
.muted{color:var(--muted)}
.notice{border-inline-start:4px solid var(--tape);background:var(--surface);padding:10px 14px;margin:0 0 18px}

/* מצב עריכה / תצוגת לקוח */
.modes{display:flex;gap:0;margin:0 0 22px;border:1.5px solid var(--ink);border-radius:4px;width:max-content;overflow:hidden}
.modes button{border:0;background:transparent;padding:7px 16px;cursor:pointer;font-weight:500}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* כותרת הפרויקט */
h1{margin:0 0 14px;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.15;font-weight:700;letter-spacing:-.01em}
h1 input{width:100%;font-weight:700;border:0;border-bottom:2px solid var(--line);background:transparent;padding:2px 0;border-radius:0}
h1 input:focus{border-bottom-color:var(--ink);outline:0}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin-bottom:12px}
@media (max-width:460px){.meta{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld-l{font-size:.82rem;color:var(--muted);font-weight:500}
.fld-v{white-space:pre-wrap;overflow-wrap:anywhere}
.fld input,.fld textarea,.fld select,.plain-input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:42px}
.fld textarea{resize:vertical;field-sizing:content;min-height:64px}

h2{font-size:1.15rem;font-weight:700;margin:40px 0 4px}
.sec-hint{margin:0 0 14px;color:var(--muted);font-size:.92rem}

/* פריט מדידה */
.item{border-top:2px solid var(--ink);padding:14px 0 22px}
.item-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.item-no{flex:none;font-size:.82rem;font-weight:600;background:var(--ink);color:var(--paper);padding:1px 8px;border-radius:3px}
.item-title{flex:1;min-width:0;font-size:1.2rem;font-weight:600;margin:0;overflow-wrap:anywhere}
input.item-title{border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:2px 0;border-radius:0}
input.item-title:focus{border-bottom-color:var(--ink);outline:0}

/* קו מידה */
.dim{display:flex;align-items:center;gap:10px;padding:5px 0}
.dim-label{flex:0 1 9.5em;min-width:4.5em;overflow-wrap:anywhere}
input.dim-label{border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 0;border-radius:0;width:9.5em}
.dim-line{flex:1;min-width:20px;height:13px;position:relative;border-inline:1.5px solid var(--ink)}
.dim-line::before{content:"";position:absolute;inset-inline:0;top:50%;border-top:1px solid var(--ink)}
.dim-val{flex:none;display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.dim-num{font-size:1.35rem;font-weight:600;border-bottom:3px solid var(--tape);padding:0 3px;direction:ltr;unicode-bidi:isolate}
input.dim-num{width:5.2em;text-align:center;border-width:0 0 3px;border-style:solid;border-color:var(--tape);background:var(--surface);border-radius:3px 3px 0 0;min-height:42px}
.dim-unit{font-size:.85rem;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.92rem;min-height:36px}
.chip:hover{border-style:solid;border-color:var(--ink)}

.item-notes{margin:10px 0 0}
p.item-notes{white-space:pre-wrap;overflow-wrap:anywhere}

/* תמונות */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin:14px 0 0;padding:0;list-style:none}
.photo button.open{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface);cursor:zoom-in;aspect-ratio:4/3}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo .cap{font-size:.85rem;margin-top:4px;overflow-wrap:anywhere}
.photo input.cap{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:3px 0;border-radius:0}

/* סקיצה */
.sk{margin:6px 0 4px}
.sk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.sk-title{margin:16px 0 6px;font-size:.95rem;font-weight:600}
.sk-top .sk-title{margin:0}
.sk-tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chip{display:inline-flex;align-items:center}
.chip.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-style:solid;border-color:var(--ink)}
.sk-hint{margin:0 0 8px;font-size:.88rem;color:var(--muted)}
.sk-canvas{display:block;width:100%;aspect-ratio:5/4;margin-top:8px;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:5% 6.25%;border:1.5px solid var(--ink);border-radius:4px;user-select:none;-webkit-user-select:none}
.sk-canvas.edit{touch-action:none;cursor:crosshair}
@media (max-width:520px){.sk:not(.full) .sk-canvas{width:calc(100% + 36px);margin-inline:-18px;border-inline:0;border-radius:0}}
.sk.full{position:fixed;inset:0;z-index:30;margin:0;background:var(--paper);overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(70px + env(safe-area-inset-bottom,0px))}
.sk.full .sk-canvas{width:min(100%,calc((100vh - 170px)*1.25));min-width:280px;margin-inline:auto}
.sk-canvas text{text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:var(--font)}
.sk-wall{stroke:var(--ink);stroke-linecap:round}
.sk-wall.on{stroke:var(--action)}
.sk-wall-in{stroke:var(--surface);stroke-linecap:round;fill:none}
.sk-wall-bg{stroke:var(--surface);fill:none}
.sk-end,.sk-badge{fill:var(--ink)}
.sk-handle{fill:var(--surface);stroke:var(--action)}
.sk-badge-t{fill:var(--paper);font-weight:600}
.sk-len{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
.sk-c{stroke:var(--ink)}
.sk-c.on{stroke:var(--action)}
.sk-c.sk-el{fill:var(--tape)}.sk-c.sk-wa{fill:var(--water)}.sk-c.sk-op{fill:var(--surface)}.sk-c.sk-ot{fill:var(--line)}
.sk-ct{fill:var(--tape-ink);font-weight:600}
.sk-ct.sk-t-op,.sk-ct.sk-t-ot{fill:var(--ink)}
.sk-prev{stroke:var(--action);stroke-linecap:round;stroke-dasharray:2 3}
.sk-arc{fill:none;stroke:var(--action)}
.sk-deg,.sk-side{fill:var(--action);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
.sk-mark{fill:var(--action)}
.sk-diag,.el-guide,.el-snap{stroke:var(--action)}
.lz{flex:none;align-self:center;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-inline-start:4px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:#E8590C;cursor:pointer;vertical-align:middle}
.pmb{flex:none;align-self:center;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-inline-start:4px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:#6B4423;font:700 18px var(--font);cursor:pointer}
.nr .pmb{width:46px;height:46px;border:1px solid #6B4423;background:#fff}
.nr-wg{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.nr-chk{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:8px}
.nr-chk input{width:22px;height:22px}
.snapb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snapb[aria-pressed="false"]{opacity:.55}
.lz svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lz.on{background:#E8590C;color:#fff;border-color:#E8590C}
.fld>.lz{align-self:flex-start;margin:4px 0 0}
.el-wall{fill:var(--surface);stroke:var(--ink)}
.el-floor{stroke:var(--ink);stroke-linecap:round}
.el-side{fill:var(--muted)}
.sk-canvas.el{aspect-ratio:25/14;background-image:none;background-color:var(--paper);margin-top:4px}
.sk-canvas:not(.edit){cursor:pointer}
.sk-elev{margin-top:16px;border-top:1px dashed var(--muted)}
.sk-acts{display:flex;flex-wrap:wrap;gap:6px}
.sk-tip{flex-basis:100%;font-size:.85rem;color:var(--muted)}
.sk-row .chip{min-height:34px;padding:4px 12px}
.sk-all{margin-top:14px}
.sk-all summary{cursor:pointer;font-weight:500;padding:8px 0;color:var(--action)}
.el-frame{fill:none;stroke:var(--ink)}
.el-sub{fill:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.need{border:2px dashed var(--danger)}
.ws{position:fixed;inset:0;z-index:40;height:100vh;height:100dvh;background:var(--paper);display:flex;flex-direction:column;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.ws[hidden]{display:none}
.ws-head{display:flex;align-items:center;gap:6px;flex:none}
.ws-head h4{flex:1;margin:0;text-align:center;font-size:1.05rem;font-weight:700}
.ws-dims{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;flex:none}
.ws-canvas{flex:1 1 auto;min-height:130px;position:relative;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--paper)}
.ws-svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;cursor:pointer}
.ws-svg.edit{touch-action:none}
.ws-svg text{text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:var(--font)}
.ws-tools{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:4px}
.ws-tools .chip{flex:none;white-space:nowrap}
.ws-panel{flex:none;max-height:40%;overflow:auto;border-top:2px solid var(--ink);padding-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ws-panel .sk-hint{margin:0}
.sk-g{display:inline-flex;flex:none;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);font-size:.82rem;font-weight:600;line-height:1}
.sk-g.sk-el{background:var(--tape);color:var(--tape-ink)}.sk-g.sk-wa{background:var(--water);color:var(--tape-ink)}.sk-g.sk-op{background:var(--surface);color:var(--ink)}.sk-g.sk-ot{background:var(--line);color:var(--ink)}
.sk-g.sq{border-radius:3px}
.chip .sk-g{width:20px;height:20px;font-size:.72rem;margin-inline-end:6px;border-color:currentColor}
.sk-list h4{margin:16px 0 2px;font-size:.92rem;font-weight:600}
.sk-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 6px;border-bottom:1px solid var(--line);border-inline-start:3px solid transparent}
.sk-row.sel{border-inline-start-color:var(--action);background:var(--surface)}
.sk-row .spacer{flex:1}
.sk-no{display:inline-flex;flex:none;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.82rem;font-weight:600}
.sk-lab{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.sk-val{color:var(--ink);font-size:1.1rem;font-variant-numeric:tabular-nums;border-bottom:3px solid var(--tape);padding:0 3px;direction:ltr;unicode-bidi:isolate}
.sk-in{width:4.8em;min-height:40px;text-align:center;border:0;border-bottom:3px solid var(--tape);background:var(--surface);border-radius:3px 3px 0 0;font-weight:600;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.sk-sel{min-height:40px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:4px 8px;max-width:100%}
.sk-note{flex:1 1 9em;min-width:8em;min-height:40px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:4px 8px}
.sk-where{font-size:.88rem;color:var(--muted)}

/* כפתורים */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:transparent;border-radius:4px;padding:9px 16px;min-height:44px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn[disabled]{opacity:.5;cursor:default}
.btn-x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px 8px;font-size:.85rem;border-radius:4px;min-height:36px;flex:none}
.btn-x:hover,.btn-x.armed{color:var(--danger)}
.btn-x.armed{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.row .spacer{flex:1}

/* קבצים */
.files{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.file{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.file-kind{flex:none;min-width:3.6em;text-align:center;font-size:.75rem;font-weight:600;border:1px solid var(--ink);border-radius:3px;padding:1px 5px}
.file a{flex:1;min-width:0;color:var(--action);font-weight:500;overflow-wrap:anywhere}
.file small{flex:none;color:var(--muted)}
.linkform{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-top:12px}
@media (max-width:520px){.linkform{grid-template-columns:1fr}}

.send{border:1.5px solid var(--ink);border-radius:6px;padding:16px;background:var(--surface);margin-top:8px}
.send p{margin:0 0 10px}
.send dl{margin:0 0 14px;display:grid;gap:8px}
.send dt{font-weight:600}
.send dd{margin:0;color:var(--muted)}

/* הודעת מצב */
#status{z-index:60;position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 12px calc(14px + env(safe-area-inset-bottom,0px))}
#status span{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:.92rem;max-width:100%}
#status span.err{background:var(--danger);color:#fff}
#status span:empty{display:none}

dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:94vh}
dialog::backdrop{background:rgba(10,14,16,.86)}
dialog img{display:block;max-width:96vw;max-height:84vh;margin:0 auto}
dialog .dlg-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;padding:8px 2px}
dialog .dlg-bar button{border:1.5px solid #fff;background:transparent;color:#fff;border-radius:4px;padding:6px 14px;cursor:pointer}

/* מראה רך ועדכני יותר */
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--paper:#F5F6F8;--line:#E2E6EB;--ink:#1B2430;--muted:#667085;--action:#2563EB;--grid:#EEF1F4}}
:root[data-theme="light"]{--paper:#F5F6F8;--line:#E2E6EB;--ink:#1B2430;--muted:#667085;--action:#2563EB;--grid:#EEF1F4}
.modes{border:0;background:var(--line);border-radius:999px;padding:3px}
.modes button{border-radius:999px;padding:7px 18px}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.16)}
.item{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px;margin-top:16px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06)}
.item-no{border-radius:999px;background:var(--action);color:#fff;padding:2px 10px}
.fld input,.fld textarea,.fld select,.plain-input{border-radius:10px}
.notice{border-radius:12px}
.chip{border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.05)}
.chip:hover{border-color:var(--action);color:var(--action)}
.chip[aria-pressed="true"],.chip.tool[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:#fff}
.sk-canvas{border:1px solid var(--line);border-radius:14px}
.photo button.open{border-radius:12px}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.06)}
.btn:hover{border-color:var(--action);color:var(--action)}
.ws-tools{flex-wrap:wrap;overflow-x:visible}
.sk-in,input.dim-num{border-radius:8px 8px 0 0}
.lib-tabs{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;margin-bottom:4px}
.chip.lib{border-radius:8px;font-weight:600}
@media (max-width:520px){main{padding-inline:10px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* מראה מקצועי: קירות במילוי, קווי מידה, זכוכית ופלדה */
:root{--glass:#D9EEFB;--glass-ln:#2F80B7;--steel:#4B5563;--selfill:#DCE7FD;--dimc:#5B6B7F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:#173548;--glass-ln:#6DB8E8;--steel:#8C97A6;--selfill:#1D3157;--dimc:#A9B4C2}}
:root[data-theme="dark"]{--glass:#173548;--glass-ln:#6DB8E8;--steel:#8C97A6;--selfill:#1D3157;--dimc:#A9B4C2}
.skh-bg{fill:var(--surface)}.skh-ln{stroke:var(--muted);opacity:.6}
.sk-wp{fill:url(#skh);stroke:var(--ink);stroke-linejoin:miter}
.sk-wp.on{fill:var(--selfill);stroke:var(--action)}
.sk-wp.gl{fill:var(--glass);stroke:var(--glass-ln)}
.sk-wp.gl.on{stroke:var(--action)}
.sk-gline{stroke:var(--glass-ln)}
.sk-mul{fill:var(--ink)}
.sk-wall-in{stroke:url(#skh)}
.sk-wall.gl{stroke:var(--glass-ln)}.sk-wall-in.gl{stroke:var(--glass)}
.sk-dim{stroke:var(--dimc);fill:none}
.sk-dimt{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
.sk-end{fill:var(--muted)}

  function alignWalls(axis){
    var ws2=it.sketch.walls,sel=st.sel&&st.sel.kind==='wall'?wallById(it,st.sel.id):null,targets=[];
    if(sel){

      if(Math.atan2(axis==='h'?sdy:sdx,axis==='h'?sdx:sdy)*180/Math.PI>45){
        say('הקיר הזה קרוב יותר לכיוון '+(axis==='h'?'האנכי':'האופקי')+'. השתמש בכפתור "יישור '+(axis==='h'?'אנכי':'אופקי')+'".',true);return;

      var dx=Math.abs(w.x2-w.x1),dy=Math.abs(w.y2-w.y1);

        if(near(w.x2,w.y2,p)){if(axis==='h')w.y2=val;else w.x2=val;}

    }
    targets.forEach(function(w){
      var ae=wallAnchorEnd(ws2,w),anc=ae===1?{x:w.x1,y:w.y1}:{x:w.x2,y:w.y2},free=ae===1?{x:w.x2,y:w.y2}:{x:w.x1,y:w.y1},

var EXT={pdf:'application/pdf',csv:'text/csv',md:'text/markdown',json:'application/json',txt:'text/plain',

function shrink(file,type){
  if(type!=='image/jpeg'&&type!=='image/png'&&type!=='image/webp')return Promise.resolve(file);

/* חלון CAD: שרטוט חופשי לחדר (קווים, צורות, הערות) */
function nxCad(it,wid){
  var st=nrSt(it),tool=st.cadT||'l',drag=null,u0=[],wall=wid?wallById(it,wid):null,VBH=wall?620:VH,geo=wall?elevGeo(wall,VW,VBH,1):null;
  
  if(!it.sketch.ecad)it.sketch.ecad={};
  function ptsToPx(pts){var r=[];(pts||[]).forEach(function(v,i){r.push(i%2===0?geo.x0+v*geo.s:geo.yF-v*geo.s);});return r;}
  function ptsFromPx(pts){var r=[];(pts||[]).forEach(function(v,i){r.push(i%2===0?(v-geo.x0)/geo.s:(geo.yF-v)/geo.s);});return r;}
  function toPx(m){return {id:m.id,t:m.t,s:m.t==='a'?String(-(parseFloat(m.s)||0)/geo.s):m.s,x1:geo.x0+m.x1*geo.s,y1:geo.yF-m.y1*geo.s,x2:geo.x0+m.x2*geo.s,y2:geo.yF-m.y2*geo.s,pts:ptsToPx(m.pts)};}
  function fromPx(m){return {id:m.id,t:m.t,s:m.t==='a'?String(-(parseFloat(m.s)||0)*geo.s):m.s,x1:(m.x1-geo.x0)/geo.s,y1:(geo.yF-m.y1)/geo.s,x2:(m.x2-geo.x0)/geo.s,y2:(geo.yF-m.y2)/geo.s,pts:ptsFromPx(m.pts)};}
  var cadArr=wall?(it.sketch.ecad[wid]||[]).map(toPx):it.sketch.cad;
  var svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('class','nr-cad-svg');svg.setAttribute('viewBox','0 0 '+VW+' '+VBH);svg.setAttribute('role','img');svg.setAttribute('aria-label','שרטוט CAD');
  var txt=h('input',{class:'nr-in nr-cad-txt',type:'text','aria-label':'טקסט להערה',placeholder:'טקסט, ואז נגיעה בשרטוט'});
  function P(ev){var pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;var m=svg.getScreenCTM();var q=m?pt.matrixTransform(m.inverse()):{x:0,y:0};return {x:clamp(q.x,0,VW),y:clamp(q.y,0,VBH)};}
  var plan='<g pointer-events="none">'+sketchMarkup(Object.assign({},it.sketch,{comps:[]}),null,1.5,null)+'</g>';
  function draw(){svg.innerHTML=plan+cadMarkup(cadArr.concat(drag?[drag]:[]));}
  function save(){if(wall)it.sketch.ecad[wid]=cadArr.map(fromPx);else it.sketch.cad=cadArr;saveItem(it,true);draw();}
  function hit(p){
    var best=null,bd=24;
    cadArr.forEach(function(m){
      var dd;
      if(m.t==='l'){var vx=m.x2-m.x1,vy=m.y2-m.y1,l2=vx*vx+vy*vy||1,t=clamp(((p.x-m.x1)*vx+(p.y-m.y1)*vy)/l2,0,1);dd=Math.hypot(p.x-(m.x1+t*vx),p.y-(m.y1+t*vy));}
      else if(m.t==='r'){var x0=Math.min(m.x1,m.x2),x1=Math.max(m.x1,m.x2),y0=Math.min(m.y1,m.y2),y1=Math.max(m.y1,m.y2);
        var ins=p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1;dd=ins?Math.min(p.x-x0,x1-p.x,p.y-y0,y1-p.y):Math.hypot(Math.max(x0-p.x,0,p.x-x1),Math.max(y0-p.y,0,p.y-y1));}
      else if(m.t==='c')dd=Math.abs(Math.hypot(p.x-m.x1,p.y-m.y1)-Math.hypot(m.x2-m.x1,m.y2-m.y1));
      else if(m.t==='w'){var vx=m.x2-m.x1,vy=m.y2-m.y1,l2=vx*vx+vy*vy||1,t=clamp(((p.x-m.x1)*vx+(p.y-m.y1)*vy)/l2,0,1);dd=Math.hypot(p.x-(m.x1+t*vx),p.y-(m.y1+t*vy));}
      else if(m.t==='a'){
        var avx=m.x2-m.x1,avy=m.y2-m.y1,avL=Math.hypot(avx,avy)||1,aab=Math.abs(parseFloat(m.s))||0;
        if(aab<1){var al2=avx*avx+avy*avy||1,at=clamp(((p.x-m.x1)*avx+(p.y-m.y1)*avy)/al2,0,1);dd=Math.hypot(p.x-(m.x1+at*avx),p.y-(m.y1+at*avy));}
        else{var anx=-avy/avL,any=avx/avL,asgn=(parseFloat(m.s)>=0)?1:-1,aR=(avL*avL/4+aab*aab)/(2*aab),
          amx=(m.x1+m.x2)/2,amy=(m.y1+m.y2)/2,acx=amx-asgn*anx*(aR-aab),acy=amy-asgn*any*(aR-aab);
          dd=Math.abs(Math.hypot(p.x-acx,p.y-acy)-aR);}
      }
      else if(m.t==='f'){
        var fp=m.pts||[],best2=1e9;
        if(fp.length>=4){for(var fi=0;fi+3<fp.length;fi+=2){var ax=fp[fi],ay=fp[fi+1],bx2=fp[fi+2],by2=fp[fi+3],vx2=bx2-ax,vy2=by2-ay,l22=vx2*vx2+vy2*vy2||1,t2=clamp(((p.x-ax)*vx2+(p.y-ay)*vy2)/l22,0,1),ddd=Math.hypot(p.x-(ax+t2*vx2),p.y-(ay+t2*vy2));if(ddd<best2)best2=ddd;}}
        else best2=Math.hypot(p.x-m.x1,p.y-m.y1);
        dd=best2;
      }

      if(dd<bd){bd=dd;best=m;}
    });
    return best;
  }
  var dragPts=[];
  function pathLen(pts){var L=0;for(var i=0;i+3<pts.length;i+=2)L+=Math.hypot(pts[i+2]-pts[i],pts[i+3]-pts[i+1]);return L;}
  svg.addEventListener('pointerdown',function(ev){
    ev.preventDefault();var p=P(ev);
    if(tool==='del'){var m=hit(p);if(m){u0.push(JSON.stringify(cadArr));cadArr=cadArr.filter(function(x){return x!==m;});save();}return;}
    if(tool==='x'){var s0=txt.value.trim();if(!s0){say('קודם כותבים את הטקסט בשדה למעלה',true);txt.focus();return;}u0.push(JSON.stringify(cadArr));cadArr.push({id:newId(),t:'x',x1:p.x,y1:p.y,x2:p.x,y2:p.y,s:s0,pts:[]});txt.value='';save();return;}

  });
  svg.addEventListener('pointermove',function(ev){
    if(!drag)return;var p=P(ev);drag.x2=p.x;drag.y2=p.y;
    if(tool==='a'||tool==='f'){
      var lx=dragPts[dragPts.length-2],ly=dragPts[dragPts.length-1];

    }
    draw();
  });
  function up(){
    if(!drag)return;var m=drag;drag=null;
    if(tool==='f'){
      if(pathLen(dragPts)>6){u0.push(JSON.stringify(cadArr));cadArr.push({id:m.id,t:'f',x1:dragPts[0],y1:dragPts[1],x2:dragPts[dragPts.length-2],y2:dragPts[dragPts.length-1],s:'',pts:dragPts.slice()});save();}else draw();
      return;
    }
    if(tool==='a'){
      var x1=dragPts[0],y1=dragPts[1],x2=dragPts[dragPts.length-2],y2=dragPts[dragPts.length-1],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
      if(L>6||pathLen(dragPts)>6){
        var nx=L>1e-6?-dy/L:0,ny=L>1e-6?dx/L:0,bulge=0;
        for(var pi=0;pi+1<dragPts.length;pi+=2){var dd=(dragPts[pi]-x1)*nx+(dragPts[pi+1]-y1)*ny;if(Math.abs(dd)>Math.abs(bulge))bulge=dd;}
        u0.push(JSON.stringify(cadArr));cadArr.push({id:m.id,t:'a',x1:x1,y1:y1,x2:x2,y2:y2,s:String(Math.round(bulge*10)/10),pts:[]});save();
      }else draw();
      return;
    }
    if(Math.hypot(m.x2-m.x1,m.y2-m.y1)>6){u0.push(JSON.stringify(cadArr));cadArr.push(m);save();}else draw();
  }
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  var tb=h('div',{class:'nr-tools'});
  function drawTb(){
    tb.replaceChildren();
    add(tb,[[['l','line','קו'],['r','rect','מלבן'],['c','circle','עיגול'],['a','arc','קשת'],['f','pen','ציור חופשי'],['w','arrow','חץ'],['x','text','טקסט'],['del','eraser','מחק']].map(function(q){return nrX(q[1],q[2],function(){tool=q[0];st.cadT=tool;drawTb();},tool===q[0]);}),
      nrX('undo','ביטול',function(){var s0=u0.pop();if(!s0){say('אין פעולה לביטול');return;}cadArr=JSON.parse(s0);save();}),
      tool==='x'?txt:null]);
  }
  drawTb();draw();
  var d=nrDlg((wall?'CAD · חזית קיר '+wallNo(it,wid)+' · מה שמציירים כאן מופיע בחזית':'CAD · '+(it.title||'חדר')+' · מה שמציירים כאן מופיע בתוכנית ב-PDF'),[tb,h('div',{class:'nr-cad-wrap'},svg)],[nrB('סגירה',function(){d.remove();render();},null,'pri')],false,'nr-cad');
}

init();
})();
