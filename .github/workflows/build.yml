name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Zip web content for the app's self-update mechanism
        run: cd "$GITHUB_WORKSPACE/app/src/main/assets/www" && zip -r "$GITHUB_WORKSPACE/web-update.zip" . -x '.*'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: measure-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK and web-update.zip as release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            web-update.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
